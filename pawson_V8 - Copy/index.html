<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0039A6">
  <title>PawsOn — GSU Clarkston Campus</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Start screen: GSU Panther logo, then the team's names one by one (js/splash.js) -->
  <div id="splash">
    <div class="s">
      <img class="splash-logo" src="img/gsu-panther.png" alt="Georgia State Panthers logo">
      <b>PawsOn</b><span>GSU Clarkston Campus</span>
      <div class="made-by">
        <small>Made by</small>
        <div id="splashName" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <!-- The map fills the whole screen -->
  <div id="map"></div>

  <!-- Top left: logo, account buttons, search, filter chips, results -->
  <div class="top">
    <div class="bar">
      <div class="brand">
        <div class="logo"><svg width="1em" height="1em" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><ellipse cx="16" cy="21.5" rx="7.2" ry="6.2"/><ellipse cx="6.8" cy="13.5" rx="2.9" ry="3.7"/><ellipse cx="12.4" cy="8" rx="2.9" ry="3.9"/><ellipse cx="19.6" cy="8" rx="2.9" ry="3.9"/><ellipse cx="25.2" cy="13.5" rx="2.9" ry="3.7"/></svg></div>
        <div><h1>PawsOn</h1><p>GSU Clarkston Campus</p></div>
        <div class="acct" id="acct"></div>
      </div>
      <div class="inner">
        <div class="search">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" placeholder="Search buildings, offices, classes, events…" autocomplete="off">
        </div>
        <div class="chips" id="chips"></div>
      </div>
    </div>
    <div class="results" id="results"></div>
  </div>

  <!-- Right side buttons: my location, back to campus, save offline -->
  <div class="ctrl">
    <button class="cbtn" id="locate" title="Show my location"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 3 3 10.5l7.2 2.3L12.5 20z"/></svg></button>
    <button class="cbtn" id="home" title="Back to campus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg></button>
    <button class="cbtn" id="dl" title="Save campus for offline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg></button>
  </div>

  <!-- Bottom left: map style, online badge, location pill -->
  <div class="seg"><button id="bMap" class="on">Map</button><button id="bSat">Satellite</button></div>
  <div class="net" id="net"><span class="dot"></span><span id="netTxt">Online</span></div>
  <div class="locpill" id="locpill" hidden></div>

  <div class="hint" id="hint">
    <svg width="1em" height="1em" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><ellipse cx="16" cy="21.5" rx="7.2" ry="6.2"/><ellipse cx="6.8" cy="13.5" rx="2.9" ry="3.7"/><ellipse cx="12.4" cy="8" rx="2.9" ry="3.9"/><ellipse cx="19.6" cy="8" rx="2.9" ry="3.9"/><ellipse cx="25.2" cy="13.5" rx="2.9" ry="3.7"/></svg>
    Tap any building to explore it
  </div>
  <div class="toast" id="toast"></div>

  <!-- The slide-in panel (filled in by js/panel.js) -->
  <aside class="drawer" id="drawer"></aside>

  <!-- Pop-up dialog and full-screen photo viewer -->
  <div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
  <div class="lb" id="lb">
    <div class="frame">
      <button class="x" onclick="closePhotoViewer()">✕</button>
      <button class="nav prev" onclick="stepPhotoViewer(-1)">‹</button>
      <img id="lbImg" alt="">
      <button class="nav next" onclick="stepPhotoViewer(1)">›</button>
      <div class="cap2"><b id="lbCap"></b><span>Photo: Georgia State University</span></div>
    </div>
  </div>

  <!-- Map library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <!-- DATA: edit these files to replace the fake info with real info -->
  <script src="data/settings.js"></script>
  <script src="data/accounts.js"></script>
  <script src="data/buildings.js"></script>
  <script src="data/interiors.js"></script>
  <script src="data/events.js"></script>
  <script src="data/equipment.js"></script>
  <script src="data/study-rooms.js"></script>

  <!-- CODE: one file per feature (order matters: helpers and state first, app last) -->
  <script src="js/helpers.js"></script>
  <script src="js/state.js"></script>
  <script src="js/map.js"></script>
  <script src="js/search.js"></script>
  <script src="js/panel.js"></script>
  <script src="js/floor-plans.js"></script>
  <script src="js/pages-events.js"></script>
  <script src="js/pages-route.js"></script>
  <script src="js/pages-equipment.js"></script>
  <script src="js/pages-study.js"></script>
  <script src="js/accounts.js"></script>
  <script src="js/location.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/splash.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
